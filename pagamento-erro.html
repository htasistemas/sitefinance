<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Pagamento não concluído | FinancePro Master</title>
    <link rel="stylesheet" href="financepromaster.css" />
    <script src="site-config.js" defer></script>
    <script src="menu.js" defer></script>
    <script src="pagamento-status.js" defer></script>
  </head>
  <body>
    <main class="section section--highlight">
      <header class="section__header section__header--center">
        <p class="eyebrow">Algo deu errado</p>
        <h1>Não conseguimos concluir o pagamento</h1>
        <p class="section__subtitle">
          Verifique os dados e tente novamente ou escolha outra forma de pagamento.
        </p>
      </header>
      <div class="status-card status-card--error">
        <p id="status-mensagem">Checando o status no banco de dados...</p>
        <p id="status-detalhes"></p>
        <a class="btn btn--ghost" href="planos.html">Voltar aos planos</a>
      </div>
    </main>
  </body>
</html>
